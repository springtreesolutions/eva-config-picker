name: Build and release

on:
  push:
    branches:
      - 'master'

# Only what @semantic-release/github needs to tag, release and comment
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Github Action Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release authenticates with GITHUB_TOKEN itself; don't leave it in .git/config for npm scripts
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - run: npm run build

      - run: npm run semantic-release
        env:
          NPM_TOKEN: ${{secrets.NPM_TOKEN}}
          # GITHUB_TOKEN is automatically available
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
