name: Release

# Release flow:
# - Every push to master updates one release PR with the version bump and changelog
#   since the last release (config: release-please-config.json)
# - Merging that PR creates the tag and GitHub release, then the publish job pushes
#   the package to npm
#
on:
  push:
    branches: [master]

# Repository writes (release PR, tags, GitHub releases) use the GitHub App token,
# so the default token only needs to read
#
permissions:
  contents: read

# Third-party actions are pinned by commit SHA (release tag in the comment)
#
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Pull requests opened with GITHUB_TOKEN do not trigger pull_request workflows,
      # so the required checks would never run on the release PR
      #
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Opens or updates the release PR; when that PR is merged it creates the tag
      # and GitHub release and sets release_created
      #
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # The npm trusted publisher only accepts OIDC tokens from this environment, and
    # its deployment branches are limited to master. Without it a release.yml pushed
    # to any other branch could publish
    #
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing, no npm token needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - run: npm run build

      # Publishes as latest. Provenance is not generated: npm does not support it
      # for private repositories
      #
      - run: npm publish
